<!DOCTYPE html>
<html>
<head>
    <title>TradeMind Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f7f7f7;
        }

        .navbar {
            background-color: #1f2937; /* dark slate */
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links a {
            color: #d1d5db;
            margin-left: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .container {
            padding: 24px;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a class="navbar-brand" href="{% url 'dashboard-home' %}">
        TradeMind
    </a>

    <div class="nav-links">
        <a href="{% url 'dashboard-home' %}">Dashboard</a>
        <a href="{% url 'dashboard-equity' %}">Equity Curve</a>
        <a href="{% url 'dashboard-risk' %}">Risk Metrics</a>
        <a href="{% url 'dashboard-upload' %}">Upload CSV</a>
    </div>
</div>

<div class="container">

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
        <hr>
    {% endif %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
