{% extends "dashboard/base.html" %}

{% block content %}
<h2>Upload Broker Trade CSV</h2>

<style>
    .upload-box {
        max-width: 520px;
        background: #ffffff;
        padding: 24px;
        border-radius: 6px;
        border: 1px solid #ddd;
        margin-top: 20px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
        color: #333;
    }

    select, input[type="file"] {
        width: 100%;
        padding: 8px;
        font-size: 14px;
    }

    .hint {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
    }

    .submit-btn {
        margin-top: 16px;
        padding: 10px 16px;
        font-size: 14px;
        background-color: #1f2937;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background-color: #111827;
    }
</style>

<div class="upload-box">

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="broker">Broker</label>
            <select name="broker" required>
                <option value="">Select broker</option>
                {% for broker in brokers %}
                    <option value="{{ broker }}">{{ broker|title }}</option>
                {% endfor %}
            </select>
            <div class="hint">
                Choose the broker format used in the CSV file.
            </div>
        </div>

        <div class="form-group">
            <label for="file">Tradebook CSV</label>
            <input type="file" name="file" accept=".csv" required>
            <div class="hint">
                Upload the raw tradebook exported from your broker.
            </div>
        </div>

        <button type="submit" class="submit-btn">
            Upload & Analyze
        </button>
    </form>

</div>

{% endblock %}
